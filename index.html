<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数学｜学びのミカタ</title>
<meta name="description" content="中学数学の要点と問題。1単元5問、学習の道で進める数学アプリ。">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
 --c:#ff8a00;--cd:#d97000;--cl:#ffe7c7;
 --ink:#3c3c3c;--body:#4b4b4b;--mute:#777;--line:#e5e5e5;--bg2:#f7f7f7;
 --green:#58cc02;--green-d:#58a700;--green-l:#d7ffb8;--red:#ff4b4b;--red-d:#ea2b2b;--red-l:#ffdfe0;
 --blue:#1cb0f6;--blue-d:#1899d6;--sun:#ffc800;--sun-d:#e5a500;
 --round:'M PLUS Rounded 1c','BIZ UDPGothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff}
body{font-family:'BIZ UDPGothic','Hiragino Sans','Noto Sans JP',sans-serif;color:var(--body);font-weight:700;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.13em;flex-shrink:0}
.app{max-width:560px;margin:0 auto;padding:0 16px 120px;min-height:100vh}
.scr{display:none}.scr.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3,.rd{font-family:var(--round);font-weight:800;color:var(--ink)}
/* 体験バナー */
.trial{display:none;align-items:center;gap:10px;background:#fff4d6;border:2px solid #ffe1a1;color:#9a5b00;border-radius:14px;padding:8px 8px 8px 14px;margin:12px 0 0;font-size:13px}
.trial.on{display:flex}
.trial button{margin-left:auto;background:var(--sun);color:#3c3c3c;border-radius:12px;padding:7px 14px;box-shadow:0 4px 0 var(--sun-d);font-family:var(--round);font-weight:800;font-size:13px;white-space:nowrap}
/* 上のバー */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--round);font-weight:800;font-size:20px;box-shadow:0 3px 0 var(--cd);flex-shrink:0}
.top h1{font-size:19px;line-height:1.2}
.top h1 small{display:block;font-size:11px;color:var(--mute);font-family:'BIZ UDPGothic',sans-serif;font-weight:700}
.stat{margin-left:auto;display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-family:var(--round);font-weight:800;font-size:15px;color:var(--ink)}
.chip .ic{font-size:18px}
.chip.fire .ic{color:#ff9600}.chip.star .ic{color:var(--sun)}
/* 学年タブ */
.gtabs{display:flex;gap:8px;padding:8px 2px 10px;overflow-x:auto;scrollbar-width:none}.gtabs::-webkit-scrollbar{display:none}
.gtab{flex:1 0 auto;min-width:76px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:8px 4px 6px;text-align:center}
.gtab b{display:block;font-family:var(--round);font-weight:800;font-size:17px;color:var(--ink);line-height:1.3}
.gtab i{display:block;font-style:normal;font-size:11px;color:var(--mute)}
.gtab.on{background:var(--c);border-color:var(--cd)}
.gtab.on b,.gtab.on i{color:#fff}
.gtab:active,.btn:active,.opt:active,.chip:active{transform:translateY(2px)}
/* ユニット帯 */
.band{background:var(--c);color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 4px 0 var(--cd);margin:4px 0 4px;display:flex;align-items:center;gap:12px}
.band small{display:block;font-size:12px;opacity:.92}
.band b{display:block;font-family:var(--round);font-weight:800;font-size:19px;line-height:1.35;margin:2px 0 4px}
.band span{font-size:12px;opacity:.95}
.band .go{margin-left:auto;flex-shrink:0;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
/* 学習の道 */
.path{display:flex;flex-direction:column;align-items:center;padding:56px 0 16px;gap:12px}
.nrow{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--x));width:200px}
.node{width:72px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--round);font-weight:800;font-size:24px;position:relative}
.node.todo{background:#e5e5e5;color:#afafaf;box-shadow:0 7px 0 #cecece}
.node.cur{background:var(--c);box-shadow:0 7px 0 var(--cd);outline:6px solid var(--cl);outline-offset:4px}
.node.done{background:var(--c);box-shadow:0 7px 0 var(--cd)}
.node.gold{background:var(--sun);box-shadow:0 7px 0 var(--sun-d)}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.node .ic{font-size:30px}
.bub{position:absolute;top:-46px;background:#fff;color:var(--c);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-family:var(--round);font-weight:800;font-size:14px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:2}
.bub::after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.nst{display:flex;gap:2px;margin-top:11px;font-size:14px;color:#e5e5e5}.nst .on{color:var(--sun)}
.nt{font-size:13px;color:var(--ink);text-align:center;line-height:1.4;margin-top:1px}
.nt small{display:block;color:var(--mute);font-size:11px}
/* 下ナビ */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:2px solid var(--line);display:none;justify-content:center;gap:4px;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
body.navon .bnav{display:flex}
.bnav button,.bnav a{flex:1;max-width:150px;border:2px solid transparent;border-radius:14px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--mute);text-decoration:none;font-family:var(--round);font-weight:800;position:relative}
.bnav .bi{font-size:24px;line-height:1;color:#afafaf}
.bnav .on{border-color:#84d8ff;background:#ddf4ff;color:var(--blue-d)}.bnav .on .bi{color:var(--blue)}
.bnav .badge{position:absolute;top:0;right:24%;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 6px;line-height:18px}
/* 共通ボタン */
.btn{display:block;width:100%;border-radius:16px;padding:14px;font-family:var(--round);font-weight:800;font-size:17px;letter-spacing:.04em;text-align:center;text-decoration:none}
.btn.pri{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.sub{background:#fff;border:2px solid var(--line);border-bottom-width:4px;color:var(--blue-d)}
.btn.dis{background:#e5e5e5;color:#afafaf;box-shadow:0 4px 0 #cecece}
.xbar{display:flex;align-items:center;gap:12px;padding:16px 0 10px}
.xbtn{font-size:26px;color:#afafaf;display:flex}
.pbar{flex:1;height:16px;background:#e5e5e5;border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
/* ポイント */
.lh{margin:8px 0 14px}
.lh small{color:var(--c);font-size:13px;font-family:var(--round);font-weight:800}
.lh h2{font-size:24px;line-height:1.35}
.lh p{color:var(--mute);font-size:14px}
.card{border:2px solid var(--line);border-radius:18px;padding:16px 16px 14px;margin-bottom:14px;background:#fff}
.card h3{font-size:15px;color:var(--c);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card h3 .ic{font-size:19px}
.pts{list-style:none}
.pts li{position:relative;padding:7px 0 7px 22px;font-size:16px;color:var(--ink);line-height:1.75;border-top:1px dashed var(--line)}
.pts li:first-child{border-top:0}
.pts li::before{content:'';position:absolute;left:3px;top:17px;width:9px;height:9px;border-radius:3px;background:var(--c)}
.pts b,.exa b{background:linear-gradient(transparent 58%,var(--cl) 58%);color:var(--ink)}
.fig{width:100%;height:auto;display:block;margin:4px 0 2px}
.fig .ax{stroke:#afafaf;stroke-width:2;fill:none}.fig .axf{fill:#afafaf}
.fig .ln{stroke:var(--c);stroke-width:4;fill:none;stroke-linecap:round}
.fig .ln2{stroke:var(--blue);stroke-width:4;fill:none;stroke-linecap:round}
.fig .ln3{stroke:var(--green);stroke-width:3;fill:none}
.fig .frame{stroke:#cfcfcf;stroke-width:2.5;fill:none}.fig .frame2{stroke:var(--ink);stroke-width:2.5;fill:none}
.fig .fill{fill:var(--cl)}
.fig .pt{fill:var(--c)}.fig .pt2{fill:var(--blue)}
.fig .boxa{fill:var(--c)}.fig .boxb{fill:var(--blue)}
.fig .lb{font:700 13px 'BIZ UDPGothic',sans-serif;fill:var(--ink)}
.fig .c{text-anchor:middle}.fig .w{fill:#fff}.fig .sm{font-size:11px}.fig .s2{fill:var(--blue-d)}.fig .s3{fill:var(--green-d)}
.exq{font-size:16px;color:var(--ink);line-height:1.75}
.exa{list-style:none;counter-reset:s;margin-top:10px;display:none}
.exa.on{display:block}
.exa li{counter-increment:s;position:relative;padding:6px 0 6px 34px;font-size:15px;color:var(--ink);line-height:1.7}
.exa li::before{content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--bg2);border:2px solid var(--line);font-size:12px;line-height:20px;text-align:center;color:var(--mute)}
.exa li:last-child{color:var(--c)}
.reveal{margin-top:12px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:9px;width:100%;color:var(--blue-d);font-family:var(--round);font-weight:800}
/* ===== ゲーム要素 ===== */
.goal{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 14px;margin:4px 0 6px}
.ring{position:relative;width:60px;height:60px;flex-shrink:0}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring .bg{stroke:#eee;stroke-width:7;fill:none}.ring .fg{stroke:#ff9600;stroke-width:7;fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .ic{position:absolute;inset:0;margin:auto;font-size:26px;color:#d6d6d6}
.ring.done .ic{color:#ff9600;animation:flame 1.2s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gtxt{flex:1;min-width:0}
.gtxt small{display:block;font-size:12px;color:var(--mute)}
.gtxt b{display:block;font-family:var(--round);font-weight:800;font-size:16px;color:var(--ink);line-height:1.35}
.lvl{display:flex;align-items:center;gap:8px;margin-top:6px}
.lvl em{font-style:normal;font-family:var(--round);font-weight:800;font-size:12px;color:#fff;background:var(--c);border-radius:8px;padding:1px 8px;box-shadow:0 2px 0 var(--cd);white-space:nowrap}
.lvl .lb{flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden}
.lvl .lb i{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .8s}
.lvl span{font-size:11px;color:var(--mute);white-space:nowrap}
.chip.fire.off .ic{color:#d0d0d0}
.sfx{font-size:22px;color:#afafaf;display:flex}
.combo{height:0;position:relative}
.combo b{position:absolute;right:0;top:-2px;font-family:var(--round);font-weight:800;font-size:15px;color:#ff9600;background:#fff4e0;border:2px solid #ffd59e;border-radius:12px;padding:2px 12px;animation:cpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes cpop{from{transform:scale(.4);opacity:0}}
.opt.ok{animation:okpop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes okpop{40%{transform:scale(1.04)}}
.opt.ng{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.xpgain{font-family:var(--round);font-weight:800;font-size:22px;color:#ff9600;margin:14px 0 2px}
.xpgain small{display:block;font-size:12px;color:var(--mute);font-family:'BIZ UDPGothic',sans-serif}
.resgoal{margin:14px 0 4px;text-align:left}
.gdone{display:inline-flex;align-items:center;gap:6px;background:#fff4e0;color:#cc7700;border-radius:12px;padding:4px 12px;font-family:var(--round);font-weight:800;font-size:14px;margin-top:8px;animation:cpop .5s .4s backwards}
.lvup{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:120;padding:24px}
.lvup.on{display:flex}
.lvbox{background:#fff;border-radius:24px;padding:28px 22px 20px;text-align:center;max-width:340px;width:100%;animation:cpop .5s cubic-bezier(.2,1.6,.4,1)}
.lvring{width:120px;height:120px;border-radius:50%;margin:0 auto 12px;background:var(--c);box-shadow:0 6px 0 var(--cd),0 0 0 10px var(--cl);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--round);font-weight:800}
.lvring small{font-size:12px;letter-spacing:.15em;opacity:.9}.lvring b{font-size:52px;line-height:1}
.lvbox h3{font-size:22px}.lvbox p{color:var(--mute);font-size:14px;margin:4px 0 16px}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:130;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
/* ===== テスト前チェック ===== */
.tlead{font-size:13px;color:var(--mute);margin:2px 0 6px}
.tsel{display:grid;gap:8px;margin:4px 0 14px}
.tall{justify-self:end;font-size:13px;color:var(--blue-d);font-family:var(--round);font-weight:800;padding:4px 6px}
.tu{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 14px;cursor:pointer}
.tu input{display:none}
.tbox{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:18px;flex-shrink:0}
.tu.on{border-color:var(--c);background:var(--cl)}.tu.on .tbox{background:var(--c);border-color:var(--c);color:#fff}
.tt{font-size:15px;color:var(--ink);line-height:1.4}.tt small{display:block;font-size:11px;color:var(--mute)}
.tsum{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.tsum.off{opacity:.5}.tsum small{display:block;font-size:12px;color:var(--mute)}.tsum b{font-family:var(--round);font-weight:800;color:var(--ink)}
.tclear{font-size:13px;color:var(--mute);padding:6px;text-decoration:underline}
.ckcount{font-family:var(--round);font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap}
.cktools{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.cktools button{display:flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-size:13px;color:var(--ink)}
.cktools button.on{border-color:var(--c);background:var(--cl)}
.ckg{margin-bottom:16px}.ckg h3{font-size:14px;color:var(--c);margin-bottom:6px}
.ckl{list-style:none;display:grid;gap:8px}
.ck{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.ckb{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:1px}
.ck.done{background:#f3fce9;border-color:#bfe9a0}.ck.done .ckb{background:var(--green);border-color:var(--green);color:#fff}
.ckq{flex:1;cursor:pointer;min-width:0}
.ckq b{display:block;font-size:15px;color:var(--ink);line-height:1.55}
.cka{display:none;font-size:15px;color:var(--c);margin-top:4px;line-height:1.55;font-weight:700}
.ckh{display:block;font-style:normal;font-size:11px;color:#afafaf;margin-top:2px}
.ck.open .cka{display:block}.ck.open .ckh{display:none}
.ckcard{border-color:var(--cl);background:linear-gradient(#fff,#fff) padding-box}
/* 例文 */
.sen{list-style:none}
.sen li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.sen li:first-child{border-top:0}
.sen .en{display:block;font-size:17px;color:var(--ink);line-height:1.5;font-family:'BIZ UDPGothic',sans-serif}
.sen .ja{display:block;font-size:13px;color:var(--mute);line-height:1.5;margin-top:2px}
.spk{flex-shrink:0;width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d);display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.spk:active{transform:translateY(2px);box-shadow:none}
.spk.big{width:64px;height:64px;border-radius:18px;font-size:32px;display:flex;margin:0 0 14px;box-shadow:0 5px 0 var(--blue-d)}
.qtext .en{font-family:'BIZ UDPGothic',sans-serif}
/* 分数 */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .12em;font-size:.92em}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .18em}
.fr>span:last-child{padding:0 .18em}
/* 問題 */
.qtag.adv{color:#fff;background:var(--c);border-color:var(--c)}
.qtag{display:inline-block;font-size:12px;color:var(--c);border:2px solid var(--cl);border-radius:10px;padding:1px 10px;margin:4px 0 10px;font-family:var(--round);font-weight:800}
.qtext{font-size:20px;color:var(--ink);line-height:1.7;min-height:64px;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px 16px;font-size:17px;color:var(--ink);text-align:left;display:flex;align-items:center;gap:12px;min-height:58px;line-height:1.5}
.opt .k{flex-shrink:0;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.opt.sel{border-color:#84d8ff;background:#ddf4ff}
.opt.ok{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.ng{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.opt:disabled{cursor:default}
.qfoot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:30}
.qfoot .in{max-width:528px;margin:0 auto}
.qfoot.good{background:var(--green-l);border-color:transparent}.qfoot.bad{background:var(--red-l);border-color:transparent}
.fbh{display:none;align-items:center;gap:10px;font-family:var(--round);font-weight:800;font-size:20px;margin-bottom:4px}
.fbh .ic{font-size:28px;background:#fff;border-radius:50%;padding:4px;width:36px;height:36px}
.good .fbh{display:flex;color:var(--green-d)}.bad .fbh{display:flex;color:var(--red-d)}
.fbx{display:none;font-size:14px;line-height:1.7;margin-bottom:12px;color:var(--ink)}
.good .fbx,.bad .fbx{display:block}
.bad .fbx b{color:var(--red-d)}
.good .btn.pri{background:var(--green)}.bad .btn.pri{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
#sQuiz{padding-bottom:220px}
/* 結果 */
.res{text-align:center;padding:30px 0 10px}
.res h2{font-size:26px;margin:10px 0 4px}
.res p{color:var(--mute);font-size:14px}
.bigst{display:flex;justify-content:center;gap:8px;font-size:56px;color:#e5e5e5;margin-top:6px}
.bigst .on{color:var(--sun);animation:pop .45s backwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.scores{display:flex;gap:10px;margin:22px 0}
.sbox{flex:1;border:2px solid var(--line);border-radius:16px;overflow:hidden}

.btn.set{background:var(--sun);color:#3c3c3c;box-shadow:0 4px 0 var(--sun-d)}

.hint{position:fixed;left:16px;right:16px;bottom:84px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;z-index:60;font-size:12.5px;color:var(--ink);display:flex;gap:10px;align-items:center;max-width:528px;margin:0 auto}

<script>
/* まちがえた子向けの解説（中学数学）：w = えらんだ答えごとの理由、calc = 式の変形、st = 考え方の順番、tip = ひと言 */
const XPL={
'正の数・負の数':[
 {w:{'+5℃':'+5℃は「0℃より5℃高い」温度。この問題は「低い」なので、マイナスをつけるよ。','5℃':'5℃は +5℃ と同じで、0℃より高い温度のこと。「低い」ときはマイナスをつけるよ。','−0.5℃':'マイナスをつけるところは合っている！ でも「5℃低い」なので、数は 5 のまま。0.5 にはならないよ。'},
  st:['0℃より「高い」→ +（正の数）、「低い」→ −（負の数）','5℃低い → −5℃'],tip:'天気予報の「マイナス5度」と同じだよ。'},
 {w:{'−7':'絶対値は「0 からのきょり」。きょりにマイナスはないので、符号（−）をとるよ。','0':'絶対値は 0 になるとはかぎらないよ。−7 は 0 から 7 はなれているので、絶対値は 7。','14':'7 を2倍してしまったね。絶対値は 0 からのきょりなので、7 のままだよ。'},
  st:['絶対値 ＝ 数直線で 0 からどれだけはなれているか','−7 は 0 から左へ 7 はなれている','だから −7 の絶対値は 7（符号をとった数）']},
 {w:{'−3':'3 と 8 なら 3 が小さいけど、マイナスの数は逆になるよ。0 から遠いほど小さい。','同じ':'−3 と −8 は別の数なので、大きさはちがうよ。','くらべられない':'マイナスの数どうしもくらべられるよ。数直線で左にあるほうが小さい。'},
  st:['数直線を思いうかべる：右へ行くほど大きく、左へ行くほど小さい','−8 は −3 より左（0 から遠い）','だから −8 のほうが小さい'],tip:'たとえると、8円の借金のほうが3円の借金より「苦しい」＝小さい。'},
 {w:{'+4だけ':'+4 は正解の1つ！ でも 0 の左側にも、0 から 4 はなれた数があるよ。','−4だけ':'−4 は正解の1つ！ でも 0 の右側にも、0 から 4 はなれた数があるよ。','0と4':'0 の絶対値は 0 なので入らないよ。0 から 4 はなれた数を、右と左の両方でさがそう。'},
  st:['絶対値が 4 ＝ 0 から 4 はなれた数','右側に 4 進むと +4、左側に 4 進むと −4','だから +4 と −4 の2つ']},
 {w:{'+300円':'収入を + で表しているので、反対の「支出（お金が出ていく）」は − で表すよ。','−500円':'マイナスにするのは合っている！ でも支出は300円なので、−300円だよ。','+200円':'500 − 300 を計算してしまったね。この問題は「300円の支出」をどう表すかを聞いているよ。'},
  st:['収入（お金が入る）を + で表すと決めた','支出（お金が出ていく）は、その反対なので −','300円の支出 → −300円']}
],
'加法と減法':[
 {w:{'+7':'7 という大きさは合っている！ でも、どちらも「−」の数をたしているので、答えも「−」になるよ。','−1':'4 と 3 をひいてしまったね。同じ符号どうしのたし算は、絶対値を「たす」よ。','+1':'4 と 3 をひいて、符号も「+」になっているよ。同じ符号どうしは絶対値をたして、その符号をつけるよ。'},
  st:['どちらも「−」（同じ符号）','同じ符号のたし算 → 絶対値をたす：4 + 3 = 7','共通の符号「−」をつける → −7'],tip:'たとえると「4円の借金」と「3円の借金」で、借金は7円。'},
 {w:{'+4':'4 という大きさは合っている！ 符号は、絶対値が大きいほうの符号になるよ。9 のほうが大きいので「−」。','−14':'9 と 5 をたしてしまったね。符号がちがうときは、大きいほうから小さいほうをひくよ。','+14':'符号がちがうのに、たしてしまっているよ。符号がちがうときは「ひき算」になる。'},
  st:['−9 と +5 で、符号がちがう','符号がちがうたし算 → 絶対値の大きいほうから小さいほうをひく：9 − 5 = 4','絶対値が大きい −9 の符号「−」をつける → −4'],tip:'たとえると「9円の借金」に「5円もらう」と、まだ4円の借金。'},
 {w:{'+5':'5 という大きさは合っている！ 2 から 7 をひくと 0 より小さくなるので「−」になるよ。','+9':'ひき算なのに、2 と 7 をたしてしまったね。','−9':'2 と 7 をたしてしまっているよ。「−(+7)」は「+(−7)」と同じ。符号のちがう数のたし算なので、ひき算になるよ。'},
  calc:['(+2) − (+7)','ひく数の符号を変えて、たし算になおす','(+2) + (−7)','符号がちがう → 7 − 2 = 5、絶対値が大きい −7 の符号','−5']},
 {w:{'−3':'3 から 6 をひいてしまったね。「−(−6)」は、ひく数の符号を変えて「+6」になるよ。','3':'6 − 3 を計算してしまったみたい。「−(−6)」は「+6」なので、3 + 6 になるよ。','−9':'符号がちがうよ。「−(−6)」は「+6」。3 + 6 で、答えは正の数になるよ。'},
  calc:['3 − (−6)','ひく数の符号を変えて、たし算になおす','3 + (+6)','3 + 6','9']},
 {w:{'−13':'+3 と −(−2) を、どちらも「ひく」にしてしまったみたい。+3 はたす、−(−2) も +2 でたすよ。','−7':'−(−2) を −2 にしてしまったね。ひく数の符号を変えると +2 になるよ。','3':'符号の見落としがあるよ。−8 から始まるので、+3 と +2 をたしても、まだ 0 より小さいよ。'},
  calc:['−8 + 3 − (−2)','−(−2) を +2 になおす','−8 + 3 + 2','正の数をまとめる：3 + 2 = 5','−8 + 5','符号がちがう → 8 − 5 = 3、絶対値が大きい −8 の符号','−3']}
],
'乗法と除法':[
 {w:{'−20':'20 は合っている！ マイナス × マイナスはプラスになるよ。','9':'4 と 5 をたしてしまったね。× はかけ算なので 4 × 5 だよ。','−9':'−4 と −5 をたしてしまったみたい。この問題はかけ算だよ。'},
  st:['まず符号を決める：− × − ＝ +（同じ符号どうしは +）','次に数をかける：4 × 5 = 20','答え：20']},
 {w:{'6':'6 は合っている！ でも + ÷ − のように符号がちがうと、答えはマイナスになるよ。','−15':'18 から 3 をひいてしまったね。÷ はわり算だよ。','15':'18 − 3 を計算してしまったね。この問題はわり算だよ。'},
  st:['まず符号を決める：+ ÷ − ＝ −（ちがう符号どうしは −）','次に数をわる：18 ÷ 3 = 6','答え：−6']},
 {w:{'−9':'(−3)² は「−3 を2回かける」こと。(−3) × (−3) で、マイナス × マイナスはプラスになるよ。','6':'3 × 2 を計算してしまったね。² は「2をかける」ではなく「同じ数を2回かける」という意味だよ。','−6':'(−3) × 2 を計算してしまったね。² は「(−3) を2回かける」という意味だよ。'},
  calc:['(−3)²','かっこの中の −3 を2回かける','(−3) × (−3)','符号を決める：− × − ＝ +','9']},
 {w:{'9':'それは (−3)² の答え。−3² は、かっこがないので 2乗するのは 3 だけ。前の − はそのまま残るよ。','6':'3 × 2 を計算してしまったね。² は「同じ数を2回かける」という意味だよ。','−6':'3 × 2 = 6 にしてしまったね。3² は 3 × 3 = 9 だよ。'},
  calc:['−3²','かっこがないので、2乗するのは 3 だけ','−(3 × 3)','3 × 3 = 9 に − をつける','−9'],tip:'(−3)² ＝ 9 と −3² ＝ −9 のちがいは、テストによく出るよ。'},
 {w:{'1':'1 は合っている！ でもマイナスが3個（奇数個）あるので、答えはマイナスになるよ。','−3':'−1 を3回たしてしまったね。この問題はかけ算だよ。','3':'たし算にしてしまったみたい。かけ算で、しかも符号はマイナスになるよ。'},
  st:['マイナスの数がいくつあるか数える → 3個','マイナスが奇数個（1・3・5…）なら答えは −、偶数個なら +','数をかける：1 × 1 × 1 = 1 → 答え：−1']}
],
'四則の混じった計算':[
 {w:{'−16':'5 + 3 を先に計算してしまったね。かけ算はたし算より先にするよ。','11':'3 × (−2) の符号がちがうよ。+ × − なので −6 になる。','16':'5 + 3 を先にして、符号もまちがえたみたい。かけ算が先で、3 × (−2) = −6 だよ。'},
  calc:['5 + 3 × (−2)','かけ算を先に：3 × (−2) = −6','5 + (−6)','符号がちがう → 6 − 5 = 1、−6 の符号','−1']},
 {w:{'−1':'かっこを無視して、かけ算を先にしてしまったね。かっこがあるときは、かっこの中がいちばん先だよ。','16':'8 × 2 = 16 は合っている！ でも ×(−2) なので、答えはマイナスになるよ。','−11':'どこかで計算がずれたみたい。かっこの中 5 + 3 = 8 を先に出してから、−2 をかけよう。'},
  calc:['(5 + 3) × (−2)','かっこの中を先に：5 + 3 = 8','8 × (−2)','+ × − ＝ −、8 × 2 = 16','−16']},
 {w:{'14':'(−2)² を −4 にしてしまったみたい。(−2) × (−2) はプラスの 4 だよ。','−6':'10 − 4 の計算か、符号のどこかがずれたみたい。(−2)² = 4、10 − 4 = 6 だよ。','12':'(−2)² を「−2 × 2」と考えて 10 − (−2)… のように計算したかも。(−2)² は (−2) × (−2) = 4 だよ。'},
  calc:['10 − (−2)²','累乗（²）を先に：(−2) × (−2) = 4','10 − 4','6']},
 {w:{'−10':'4 + 7 を先に計算してしまったね。わり算はたし算より先にするよ。','10':'−12 ÷ 4 の符号がちがうよ。− ÷ + なので −3 になる。','−4':'−3 + 7 の計算がずれたみたい。符号がちがうので 7 − 3 = 4、7 の符号の + になるよ。'},
  calc:['−12 ÷ 4 + 7','わり算を先に：−12 ÷ 4 = −3','−3 + 7','符号がちがう → 7 − 3 = 4、+7 の符号','4']},
 {w:{'7':'12 × [[1|3]] = 4 と 12 × [[1|4]] = 3 はできている！ でも、かっこの中は「−」なので、4 + 3 ではなく 4 − 3 だよ。','−1':'3 − 4 にしてしまったみたい。順番どおり 4 − 3 だよ。','12':'分配法則は、かっこの中の「全部」に 12 をかけるよ。12 だけ残ることはないよ。'},
  calc:['12 × ([[1|3]] − [[1|4]])','分配法則：12 をかっこの中の両方にかける','12 × [[1|3]] − 12 × [[1|4]]','4 − 3','1']}
],
'文字式の表し方':[
 {w:{'y5':'× を省くときは、数を文字の前に書くルールだよ。','5×y':'文字式では × を書かないのがルール。','5+y':'× を + に変えてはいけないよ。× を省くだけ。'},
  st:['文字式のルール① × は書かない','ルール② 数は文字の前に書く','y × 5 → 5y']},
 {w:{'−1a':'−1 の「1」は書かないルールだよ。−a と書く。','a−1':'× を − に変えてはいけないよ。a に −1 をかけた形を書くよ。','1−a':'× を − に変えてはいけないよ。'},
  st:['a × (−1) は「−1 × a」と同じ','数を前に書いて、× を省く → −1a','「1」は書かないルール → −a']},
 {w:{'3x':'3x は x + x + x（たし算）のこと。かけ算を3回するときは累乗（小さい3）を使うよ。','x3':'3 を文字のうしろに大きく書くと、x × 3 の意味になってしまうよ。右上に小さく書くのが累乗。','xxx':'同じ文字を何回もかけるときは、累乗を使ってまとめるよ。'},

let _au=null;
function say(t){try{if(_au){_au.pause();_au=null}speechSynthesis&&speechSynthesis.cancel()}catch(e){}
 const id=AUDIO[t];let fell=false;const fb=()=>{if(fell)return;fell=true;tts(t)};
 if(id){_au=new Audio(id+'.mp3');_au.onerror=fb;_au.play().catch(fb)}else tts(t)}
function tts(t){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;
 const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
 const v=vs.find(v=>/Samantha|Ava|Allison|Google US English|Jenny|Aria/i.test(v.name))||vs[0];if(v)u.voice=v;speechSynthesis.speak(u)}
/* ===================== 保存 ===================== */
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const lj=(k,d)=>{try{return JSON.parse(ls(k))||d}catch(e){return d}};
const PK=APP_ID+'_prog_v2',RK=APP_ID+'_review_v2',DK=APP_ID+'_days_v2',GK=APP_ID+'_grade_v2';

/* ===================== 体験・購入（従来のキーをそのまま使う） ===================== */
const TRIAL_DAYS=7,UNLOCK_KEY='app_unlocked_'+APP_ID,BUNDLE_KEY='bundle_unlocked_v1',TRIAL_KEY='app_trial_start_'+APP_ID;
(function(){const p=new URLSearchParams(location.search);
 if(p.get('unlock')==='yes')ls(UNLOCK_KEY,'true');
 if(p.get('unlock')==='bundle')ls(BUNDLE_KEY,'true');
 if(p.get('unlock'))history.replaceState(null,'',location.pathname);
 if(!ls(TRIAL_KEY))ls(TRIAL_KEY,String(Date.now()));})();
const isUnlocked=()=>ls(UNLOCK_KEY)==='true'||ls(BUNDLE_KEY)==='true';
const daysLeft=()=>Math.max(0,Math.ceil(TRIAL_DAYS-(Date.now()-parseInt(ls(TRIAL_KEY)||Date.now(),10))/864e5));
const trialOver=()=>!isUnlocked()&&daysLeft()<=0;
function showTrial(){const t=document.getElementById('trial');if(isUnlocked()){t.classList.remove('on');return}
 t.classList.add('on');document.getElementById('trialText').textContent=daysLeft()>0?`無料体験中：のこり${daysLeft()}日`:'無料体験は終了しました'}
function openBuy(){const o=trialOver();document.getElementById('buyTtl').textContent=o?'無料体験が終わりました':'続けて学習するには';
 document.getElementById('buyClose').hidden=o;document.getElementById('ovBuy').classList.add('on')}
function closeBuy(){document.getElementById('ovBuy').classList.remove('on')}
function guard(){if(trialOver()){openBuy();return false}return true}

const fmt=s=>esc(s).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
UNITS.forEach(u=>{u.nb=u.qs.length;if(ADV[u.t])u.qs=u.qs.concat(ADV[u.t])});
const GL=[...new Set(UNITS.map(u=>u.g))];
UNITS.forEach((u,i)=>{u.i=i;u.n=UNITS.filter((x,j)=>x.g===u.g&&j<i).length+1;u.key=u.g+'-'+u.n});
const starsOf=u=>PROG[u.key]||0;
const GN={};const gName=g=>GN[g]||('中'+g);
function curG(){const g=parseInt(ls(GK),10);return GL.includes(g)?g:GL[0]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===================== 経験値・今日の目標・効果音 ===================== */
const XK=APP_ID+'_xp_v2',DXK=APP_ID+'_dxp_v2',GOAL=50;
const getXP=()=>parseInt(ls(XK)||'0',10)||0;
function lvInfo(x){let l=1,need=100;while(x>=need){x-=need;l++;need=100+(l-1)*50}return {l,cur:x,need}}
function todayXP(){return (lj(DXK,{}))[today()]||0}
function addXP(n){const d=lj(DXK,{});const t=today();const before={lv:lvInfo(getXP()).l,day:d[t]||0};
 ls(XK,String(getXP()+n));d[t]=(d[t]||0)+n;const keys=Object.keys(d);if(keys.length>60)delete d[keys[0]];ls(DXK,JSON.stringify(d));
 const lv=lvInfo(getXP()).l;if(d[t]>=GOAL)markDay();return {lvUp:lv>before.lv,lv,goalNow:before.day<GOAL&&d[t]>=GOAL}}
function ringHTML(v){const c=2*Math.PI*26,p=Math.min(1,v/GOAL);return `<div class="ring ${p>=1?'done':''}"><svg viewBox="0 0 60 60"><circle class="bg" cx="30" cy="30" r="26"/><circle class="fg" cx="30" cy="30" r="26" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>${IC.fire}</div>`}
function lvHTML(){const L=lvInfo(getXP());return `<div class="lvl"><em>Lv.${L.l}</em><div class="lb"><i style="width:${L.cur/L.need*100}%"></i></div><span>${L.cur} / ${L.need} XP</span></div>`}
function renderGoal(){const v=todayXP();
 document.getElementById('goal').innerHTML=ringHTML(v)+`<div class="gtxt"><small>今日の目標 ${GOAL} XP</small><b>${v>=GOAL?'今日の目標クリア':'あと '+(GOAL-v)+' XP'}</b>${lvHTML()}</div>`}
let sfxOn=ls('mikata_sfx')!=='off',AC=null;
function toggleSfx(){sfxOn=!sfxOn;ls('mikata_sfx',sfxOn?'on':'off');drawSfx()}
function drawSfx(){const b=document.getElementById('sfxBtn');if(b)b.innerHTML=sfxOn?IC.sound:IC.mute}
function tone(f,t0,d,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
 g.gain.setValueAtTime(0,AC.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.18,AC.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+d);
 o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+.02)}
function sfx(k,n){if(!sfxOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 if(k==='ok'){const b=1+Math.min(n||0,6)*.06;tone(784*b,0,.12,'triangle');tone(1175*b,.08,.22,'triangle')}
 else if(k==='ng'){tone(220,0,.18,'square',.08);tone(185,.12,.25,'square',.08)}
 else if(k==='fin'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.3,'triangle'))}
 else if(k==='lv'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.08,.35,'triangle',.16))}}catch(e){}}
function confetti(n){const cols=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];
 for(let i=0;i<(n||70);i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=cols[i%cols.length];
  e.style.setProperty('--dx',(Math.random()*160-80)+'px');e.style.setProperty('--r',(Math.random()*900-450)+'deg');
  e.style.animationDuration=(1.6+Math.random()*1.4)+'s';e.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3600)}}
function countUp(el,to){let v=0;const st=performance.now();(function f(t){v=Math.min(to,Math.round(to*Math.min(1,(t-st)/700)));el.textContent='+'+v+' XP';if(v<to)requestAnimationFrame(f)})(st)}
/* ===================== 連続日数 ===================== */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function markDay(){const d=lj(DK,[]);if(!d.includes(today())){d.push(today());ls(DK,JSON.stringify(d.slice(-400)))}}
function streak(){const d=new Set(lj(DK,[]));let n=0;const t=new Date();
 const key=x=>x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();
 if(!d.has(key(t)))t.setDate(t.getDate()-1);
 while(d.has(key(t))){n++;t.setDate(t.getDate()-1)}return n}

 document.getElementById('pList').innerHTML=U.pt.map(p=>`<li>${fmt(p)}</li>`).join('');
 document.getElementById('senCard').hidden=!U.sen;
 if(U.sen)document.getElementById('senList').innerHTML=U.sen.map(([en,ja])=>`<li><button class="spk" onclick="say(${esc(JSON.stringify(en))})" aria-label="きく">${IC.sound}</button><div><span class="en">${esc(en)}</span><span class="ja">${fmt(ja)}</span></div></li>`).join('');
 const ck=CK[U.t]||[];document.getElementById('ckCard').hidden=!ck.length;
 document.getElementById('ckUnit').innerHTML=ck.map((c,k)=>ckRow(U.i,k,c,false)).join('');

 go('sPoint')}

/* ===================== 問題 ===================== */
let Q=null;
function startQuiz(list,mode){
 const items=list||U.qs.map((q,j)=>({u:U.i,j}));
 Q={items,k:0,ok:0,miss:[],mode:mode||'unit',sel:null,state:'pick',combo:0,best:0};
 drawSfx();document.getElementById('combo').innerHTML='';
 go('sQuiz');showQ()}
function showQ(){const it=Q.items[Q.k],u=UNITS[it.u],q=u.qs[it.j];
 Q.cur={u,q,opts:shuffle([q[1],...q[2]])};Q.sel=null;Q.state='pick';
 document.getElementById('qBar').style.width=(Q.k/Q.items.length*100)+'%';
 document.getElementById('qTag').textContent=Q.mode==='review'?`復習｜${gName(u.g)} ${u.t}`:(u.qs.length>u.nb?(Q.items[Q.k].j<u.nb?'基本　':'応用　'):'')+`${Q.k+1} / ${Q.items.length}`;
 document.getElementById('qTag').classList.toggle('adv',Q.mode!=='review'&&Q.items[Q.k].j>=u.nb);
 document.getElementById('qText').innerHTML=(q[4]?`<button class="spk big" onclick="say(${esc(JSON.stringify(q[4]))})" aria-label="きく">${IC.sound}</button>`:'')+fmt(q[0]);
 if(q[4])setTimeout(()=>say(q[4]),350);
 document.getElementById('opts').innerHTML=Q.cur.opts.map((o,n)=>`<button class="opt" data-n="${n}" onclick="pick(${n})"><span class="k">${n+1}</span><span>${fmt(o)}</span></button>`).join('');
 const f=document.getElementById('qFoot');f.className='qfoot';
 const b=document.getElementById('qBtn');b.className='btn dis';b.textContent='答えあわせ'}
function pick(n){if(Q.state!=='pick')return;Q.sel=n;
 document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',+o.dataset.n===n));
 document.getElementById('qBtn').className='btn pri'}
function qAction(){
 if(Q.state==='pick'){if(Q.sel===null)return;check()}
 else{Q.k++;if(Q.k<Q.items.length)showQ();else finish()}}
function check(){Q.state='done';const {q,opts,u}=Q.cur,it=Q.items[Q.k];const ok=opts[Q.sel]===q[1];const id=it.u+':'+it.j;
 document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;o.classList.remove('sel');const v=opts[+o.dataset.n];
  if(v===q[1])o.classList.add('ok');else if(+o.dataset.n===Q.sel)o.classList.add('ng')});
 const f=document.getElementById('qFoot');f.className='qfoot '+(ok?'good':'bad');
 document.getElementById('fbh').innerHTML=ok?IC.check+'正解':IC.x+'不正解';
 const XP=(typeof XPL!=='undefined'&&XPL[u.t]&&it.j<u.nb)?XPL[u.t][it.j]:null,mine=opts[Q.sel],br=t=>fmt(t).replace(/\n/g,'<br>');
 document.getElementById('fbx').innerHTML=ok?fmt(q[3]):(XP?`<div class="why"><span class="whyh">えらんだ「${fmt(mine)}」</span>${br((XP.w&&XP.w[mine])||q[3])}</div><div class="ans">正解：<b>${fmt(q[1])}</b></div><div class="sth">こう考えよう</div>`+(XP.calc?`<div class="calc">${XP.calc.map((x,k)=>/[ぁ-んァ-ヶ一-龯]/.test(x.replace(/[（(][^）)]*[）)]$/,''))?`<div class="cnt">${k?'↓ ':''}${fmt(x)}</div>`:`<div class="ceq">${fmt(x)}</div>`).join('')}</div>`:'')+(XP.st?`<ol class="steps">${XP.st.map(x=>`<li>${fmt(x)}</li>`).join('')}</ol>`:'')+(XP.tip?`<div class="tip">${fmt(XP.tip)}</div>`:''):`正解：<b>${fmt(q[1])}</b><br>`+fmt(q[3]));
 const b=document.getElementById('qBtn');b.className='btn pri';b.textContent='つぎへ';
 if(ok){Q.ok++;Q.combo++;Q.best=Math.max(Q.best,Q.combo);REV=REV.filter(x=>x!==id);sfx('ok',Q.combo)}
 else{Q.combo=0;Q.miss.push({q,u});if(!REV.includes(id))REV.push(id);sfx('ng');try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
 document.getElementById('combo').innerHTML=Q.combo>=2?`<b>${Q.combo}問連続 正解</b>`:'';
 ls(RK,JSON.stringify(REV));
 document.getElementById('qBar').style.width=((Q.k+1)/Q.items.length*100)+'%'}
function quitQuiz(){go(Q&&Q.mode==='review'?'sReview':Q&&Q.mode==='test'?'sCheck':'sPoint')}
function finish(){const n=Q.items.length,ok=Q.ok;let html='';
 const bonus=(Q.mode==='unit'&&ok===n)?20:0,gain=ok*10+bonus,R=addXP(gain);sfx('fin');
 const xpBlock=`<div class="xpgain"><span id="xpNum">+0 XP</span><small>正解 ${ok}問 × 10${bonus?' ＋ 全問正解ボーナス 20':''}${Q.best>=3?'　最大 '+Q.best+'問連続':''}</small></div>
  <div class="goal resgoal">${ringHTML(todayXP())}<div class="gtxt"><small>今日の目標 ${GOAL} XP</small><b>${todayXP()>=GOAL?'今日の目標クリア':'あと '+(GOAL-todayXP())+' XP'}</b>${lvHTML()}</div></div>
  ${R.goalNow?`<div class="gdone">${IC.fire}今日の目標を達成しました　連続 ${streak()}日</div>`:''}`;
 if(Q.mode==='unit'){const r=ok/n,st=r===1?3:r>=.8?2:r>=.6?1:0;const prev=starsOf(U);if(st>prev){PROG[U.key]=st;ls(PK,JSON.stringify(PROG))}
  const msg=st===3?'全問正解':st===2?'あと少しで満点':st===1?'クリア':'もう一度ポイントを確認しよう';
  html=`<div class="bigst">${[1,2,3].map(k=>`<span class="${k<=st?'on':''}" style="animation-delay:${k*.15}s">${IC.star}</span>`).join('')}</div>
  <h2>${msg}</h2><p>${esc(U.t)}</p>${xpBlock}
  ${Q.miss.length?`<ul class="miss">${Q.miss.map(m=>`<li>${fmt(m.q[0])}<span>正解：${fmt(m.q[1])}</span></li>`).join('')}</ul>`:''}
  <div class="stack">${st<3?`<button class="btn pri" onclick="startQuiz()">もう一度とく</button>`:''}
  ${nextUnit()?`<button class="btn ${st<3?'sub':'pri'}" onclick="openUnit(${nextUnit().i})">つぎの単元へ</button>`:''}
  <button class="btn sub" onclick="go('sHome')">学習の道にもどる</button></div>`}
 else if(Q.mode==='test'){html=`<div class="bigst" style="color:var(--c)">${IC.clip}</div><h2>範囲テスト ${ok} / ${n}</h2><p>${ok===n?'範囲はばっちり。':ok>=n*.8?'あと少し。まちがえた問題を見直そう。':'チェック項目とまちがえた問題をもう一度確認しよう。'}</p>${xpBlock}
  ${Q.miss.length?`<ul class="miss">${Q.miss.map(m=>`<li><small style="color:var(--c)">${esc(m.u.t)}</small><br>${fmt(m.q[0])}<span>正解：${fmt(m.q[1])}</span></li>`).join('')}</ul>`:''}
  <div class="stack"><button class="btn pri" onclick="startRangeTest()">もう一度10問</button><button class="btn sub" onclick="go('sCheck')">チェック項目にもどる</button></div>`}
 else{html=`<div class="bigst" style="color:var(--green)">${IC.trophy}</div><h2>復習おわり</h2><p>${n}問中 ${ok}問 正解</p>${xpBlock}
  <p style="margin-top:6px">正解した問題は、復習リストから消えました。</p>
  <div class="stack"><button class="btn pri" onclick="go('sReview')">復習リストへ</button><button class="btn sub" onclick="go('sHome')">学習の道にもどる</button></div>`}
 document.getElementById('res').innerHTML=html;go('sResult');
 countUp(document.getElementById('xpNum'),gain);
 if(ok===n||R.goalNow)setTimeout(()=>confetti(60),250);
 if(R.lvUp)setTimeout(()=>{document.getElementById('lvNum').textContent=R.lv;document.getElementById('lvMsg').textContent=`レベル${R.lv}になりました。この調子で続けよう。`;
  document.getElementById('lvup').classList.add('on');sfx('lv');confetti(90)},1100)}

function ckRow(ui,k,c,big){const id=ui+':'+k,d=CKD.has(id);
 return `<li class="ck ${d?'done':''} ${ckOpenAll?'open':''}" data-id="${id}"><button class="ckb" onclick="ckToggle('${id}',this)" aria-label="覚えた">${IC.check}</button>

 el.innerHTML=`<p class="tlead">テストに出る単元を選ぶと、「ここだけはチェック」の一問一答と、その範囲だけの10問テストができます。</p>

  <div class="stack"><button class="btn ${S.length?'pri':'dis'}" onclick="if(selUnits().length&&guard())go('sCheck')">チェックをはじめる</button><button class="btn ${S.length?'sub':'dis'}" onclick="if(selUnits().length)startRangeTest()">この範囲から10問テスト</button>
  ${S.length?`<button class="tclear" onclick="TSEL.clear();saveSel();renderTest()">選んだ範囲をすべてクリア</button>`:''}</div>`}

 document.getElementById('ckOpen').textContent=ckOpenAll?'答えをかくす':'答えをすべて表示';

  if(!rows.length)return '';return `<div class="ckg"><h3>${gName(u.g)}・${esc(u.t)}</h3><ul class="ckl">${rows.map(([c,k])=>ckRow(u.i,k,c,true)).join('')}</ul></div>`}).join('')
  ||`<div class="empty"><div>${IC.check}</div><h3>ぜんぶ覚えました</h3><p>この範囲から10問テストで仕上げよう。</p></div>`;
 ckProgress()}
